---
layout: internal
title: Short post (with subtitle)
permalink: /generator-standard

description: A short post with a title, optional subtitle, and date.
---

			<div class="wrapper">
				<h1>Short post (with subtitle)</h1>
				<p><a href="/generator">zurück</a></p>
				<form id="form">
					<label for="title">Title</label>
					<input type="text" id="title" placeholder="Natio-Trainingslager" required />
					<label for="subtitle">Subtitle</label>
					<input type="text" id="subtitle" placeholder="in Bonn" />
					<label for="date">Date</label>
					<input type="text" id="date" placeholder="1. Januar" required />

					<label for="rheinos">Rheinos Bonn</label>
		      <input type="radio" id="rheinos" name="logo" value="o" required />
		      <label for="rheiniis">RheinIIs</label>
		      <input type="radio" id="rheiniis" name="logo" value="ii" required />
		      <label for="no-logo">No logo</label>
		      <input type="radio" id="no-logo" name="logo" value="none" />

					{% include sharepic_photo_picker.html %}
					<label for="credit">Photo Credit</label>
					<input type="text" id="credit" placeholder="Foto: Name" />
					<label for="tournamentlogo">Tournament logo</label>
					<input type="file" id="tournamentlogo" accept = "image/*" />

					<button type="submit" name="button">Submit</button>
					<a id="download" download>Herunterladen</a>
				</form>


				<div id="capture" class="standard" style="width: 1080px; height: 1080px; overflow: hidden;">
					<img class="logo" id="logo" src="images/rheinos-bonn-300px.webp" />
					<img id="bgimage" src="images/lisa3-1920px.webp" />
					<div class="credit"></div>
					<img class="tournamentlogo" src="" />
					<div class="text-wrapper">
						<div class="text">
							<div class="title">Trainingslager</div>
							<div class="subtitle" enabled="false">in Bonn</div>
						</div>
					</div>
					<div class="date">1. Januar</div>

				</div>

				<script src="../js/html2canvas/html2canvas.js"></script>
				<script src="../js/generator.js"></script>
				<script src="../js/generator-standard.js"></script>
			</div>
